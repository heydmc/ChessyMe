<!DOCTYPE html>
<html>
<head>
  <title>Authentication</title>
  <style>
    body { font-family: sans-serif; padding: 10px; text-align: center; }
    div { margin-bottom: 10px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { padding: 6px; width: 200px; }
    button { padding: 10px 20px; cursor: pointer; }
    .error { color: red; font-size: 12px; min-height: 14px; }
    h3 { color: #4CAF50; }
  </style>
</head>
<body>
  <h2>Authenticate Your Account</h2>

  <div id="phone-entry-view">
    <label for="phoneNumber">Phone Number:</label>
    <input type="tel" id="phoneNumber" placeholder="+919876543210">
    <div id="phone-error" class="error"></div>
    <button id="send-otp-btn">Send OTP</button>
  </div>

  <div id="otp-verify-view" style="display:none;">
    <label for="otpCode">Verification Code:</label>
    <input type="text" id="otpCode" placeholder="6-digit code">
    <div id="otp-error" class="error"></div>
    <button id="verify-otp-btn">Verify</button>
  </div>

  <div id="auth-success-view" style="display:none;">
    <h3>All Done!</h3>
    <p>You can now close this tab.</p>
  </div>

  <div id="recaptcha-container"></div>

  <script src="firebase-app-compat.js"></script>
  <script src="firebase-auth-compat.js"></script>
  <script src="firebase-firestore-compat.js"></script>
  <script src="auth.js"></script> </body>
</html>
