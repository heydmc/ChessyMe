<!DOCTYPE html>
<html>
<head>
  <title>Chess.com Tools</title>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <div class="container">
    <div class="main-view">
      <h1 class="title">ChessY Me Tools</h1>
      <button id="review-btn">Review Game</button>
      <button id="adblock-btn">Toggle Ad-Block</button>
      <button id="buy-plan-btn">Buy Plan</button>
      <button id="how-to-use-btn">How to Use</button>
      <button id="settings-btn">Settings</button>
    </div>

    <div id="buy-plan-view" style="display: none;">
        <h1 class="title">Buy a Plan</h1>
        <div class="input-group">
            <input type="number" id="days-input" placeholder="Enter days">
            <span id="price-display">Price: ₹0</span>
        </div>
        <button id="buy-now-btn">Buy Now</button>
        <button id="trial-btn">Start 3-Day Free Trial</button>
        <button id="show-coupon-btn">Have a Coupon Code?</button>

        <!-- Coupon Code Section (initially hidden) -->
        <div id="coupon-section" style="display: none;">
            <input type="text" id="coupon-input" placeholder="Enter Code">
            <button id="apply-coupon-btn">Apply Coupon</button>
        </div>

        <button id="back-btn">Back</button>
    </div>
    
    <!-- Error Message container -->
    <div id="error-container">
        <p id="error-message" class="error"></p>
    </div>

  <!-- START: New Authentication Section -->
<div class="auth-section">

  <!-- This is the single button that shows initially -->
  <div id="initial-auth-view">
    <button id="show-login-form-btn">Login / Sign Up</button>
  </div>

  <!-- This is the form that is hidden by default -->
  <div id="login-form-container" style="display: none;">
    <h1 class="title">Enter Details</h1>
    <div class="form-group" style="margin-bottom: 10px;">
      <input type="email" id="email-input" placeholder="Email">
    </div>
    <div class="form-group" style="margin-bottom: 10px;">
      <input type="password" id="password-input" placeholder="Password">
    </div>
    <p id="auth-error" ></p>
    <button id="login-btn">Login</button>
    <button id="signup-btn">Sign Up</button>
  </div>

  <!-- This is the view for a logged-in user, also hidden by default -->
  <div id="logged-in-view" style="display: none;">
    <p id="auth-status">Welcome!</p>
    <button id="logout-btn">Logout</button>
  </div>


<div id="verification-view" style="display: none;">
  <h1 class="title">Check Your Email</h1>
  <p style="text-align: center; font-size: 14px; margin-bottom: 20px;">
    Thank you for signing up! We've sent a verification link to your email address. Please click the link to activate your account.
  </p>
  
  <p style="text-align: center; font-size: 12px; color: #555; margin-top: -10px; margin-bottom: 20px;">
    If you don't see the email, please check your Spam or Junk folder.
  </p>
  <button id="verified-btn">I Have Verified</button>
</div>

</div>
<!-- END: New Authentication Section -->

  <script src="firebase-app-compat.js"></script>
  <script src="firebase-auth-compat.js"></script>
  <script src="firebase-firestore-compat.js"></script> 
  <script src="popup.js"></script>

</body>
</html>
